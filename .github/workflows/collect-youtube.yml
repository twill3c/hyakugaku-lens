name: collect-youtube

# 定期実行は**適用**(data/yt_channels.jsonl の許可チャンネルだけを採る)。
# 手動実行は既定が**審査のみ** —— 許可リストを育てるために候補を全部出す。
#
# なぜ許可リストが要るか: この 100 名は学者なので「本人が話す動画」より
# 「本人について語る動画」のほうが多い。題名の字面では両者を分けられないことを
# 実測した(loop_011 で四つの規則がいずれも届かなかった)。分けられるのは**場**である。
on:
  schedule:
    - cron: '5 20 * * *'   # 毎日 UTC 20:05(JST 05:05 頃)。1 日 50 名・2 日で一巡
  workflow_dispatch:
    inputs:
      apply:
        description: "true にすると people.json へ書き込む(既定は審査のみ)"
        type: boolean
        default: false
      limit:
        description: "検索する人数の上限(0 なら組の全員=50 名)。較正を安く回すため"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: collect-youtube
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 候補を集める
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -m src.youtube             ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}             --limit=${{ inputs.limit || 0 }}
      - name: 差分があるときだけコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ out/
          if git diff --cached --quiet; then
            echo "変更なし — コミットしない"
          else
            git commit -m "data: youtube $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
